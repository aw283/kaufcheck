<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, system-ui, sans-serif">
  <!-- Hintergrund -->
  <rect width="640" height="400" fill="#f8fafc" rx="12"/>

  <!-- Titel -->
  <text x="320" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Kaufnebenkosten bei 350.000 &#8364; Kaufpreis</text>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#64748b">Kreditfinanzierung mit 280.000 &#8364; Kredit, inkl. Makler &#8212; Richtwerte</text>

  <!-- Balken Grunderwerbsteuer 3,5% = 12.250 -->
  <rect x="180" y="78" width="252" height="34" fill="#1e3a8a" rx="4"/>
  <text x="174" y="100" text-anchor="end" font-size="12" fill="#1e3a8a" font-weight="600">Grunderwerbsteuer</text>
  <text x="440" y="100" font-size="12" fill="#1e3a8a" font-weight="700">12.250 &#8364; (3,5 %)</text>

  <!-- Balken Grundbucheintragung 1,1% = 3.850 -->
  <rect x="180" y="124" width="79" height="34" fill="#1e3a8a" rx="4" opacity="0.7"/>
  <text x="174" y="146" text-anchor="end" font-size="12" fill="#1e3a8a" font-weight="600">Grundbucheintragung</text>
  <text x="267" y="146" font-size="12" fill="#1e3a8a" font-weight="700">&#160;3.850 &#8364; (1,1 %)</text>

  <!-- Balken Pfandrecht 1,2% von 280.000 = 3.360 -->
  <rect x="180" y="170" width="69" height="34" fill="#475569" rx="4"/>
  <text x="174" y="192" text-anchor="end" font-size="12" fill="#475569" font-weight="600">Pfandrechtseintragung</text>
  <text x="257" y="192" font-size="12" fill="#475569" font-weight="700">&#160;3.360 &#8364; (1,2 %&#42;)</text>

  <!-- Balken Notar/Rechtsanwalt ~2% = 7.000 -->
  <rect x="180" y="216" width="144" height="34" fill="#f59e0b" rx="4"/>
  <text x="174" y="238" text-anchor="end" font-size="12" fill="#92400e" font-weight="600">Notar / Treuhand</text>
  <text x="332" y="238" font-size="12" fill="#92400e" font-weight="700">&#160;~7.000 &#8364; (ca. 2 %)</text>

  <!-- Balken Maklerprovision 3% + 20% USt = 12.600 -->
  <rect x="180" y="262" width="258" height="34" fill="#dc2626" rx="4"/>
  <text x="174" y="284" text-anchor="end" font-size="12" fill="#dc2626" font-weight="600">Maklerprovision</text>
  <text x="446" y="284" font-size="12" fill="#dc2626" font-weight="700">12.600 &#8364; (3 % + USt)</text>

  <!-- Trennlinie -->
  <line x1="180" y1="314" x2="520" y2="314" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Summe -->
  <rect x="180" y="322" width="336" height="38" fill="#1e3a8a" rx="4"/>
  <text x="188" y="346" font-size="13" fill="white" font-weight="700">Gesamt Nebenkosten: ca. 39.060 &#8364;</text>
  <text x="524" y="346" text-anchor="end" font-size="13" fill="#93c5fd" font-weight="700">&#8776; 11,2 %</text>

  <!-- Hinweis -->
  <text x="320" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">&#42; Pfandrecht: 1,2 % der Kreditsumme (280.000 &#8364;). Notar inkl. 20 % USt. Richtwerte, Stand Juni 2026.</text>
</svg>
