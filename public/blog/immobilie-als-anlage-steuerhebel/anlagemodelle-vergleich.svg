<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Inter, system-ui, sans-serif">
  <!-- Hintergrund -->
  <rect width="640" height="420" fill="#f8fafc" rx="12"/>

  <!-- Titel -->
  <text x="320" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">3 Anlagemodelle im Vergleich</text>
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#64748b">Richtwerte &#8212; keine Anlage- oder Steuerberatung. Steuerberater konsultieren.</text>

  <!-- Spaltenk&#246;pfe -->
  <rect x="20" y="72" width="180" height="36" fill="#e2e8f0" rx="4"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Kriterium</text>

  <rect x="208" y="72" width="132" height="36" fill="#1e3a8a" rx="4"/>
  <text x="274" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="white">Vorsorge-</text>
  <text x="274" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="white">wohnung</text>

  <rect x="348" y="72" width="132" height="36" fill="#16a34a" rx="4"/>
  <text x="414" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="white">Bauherren-</text>
  <text x="414" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="white">modell</text>

  <rect x="488" y="72" width="132" height="36" fill="#f59e0b" rx="4"/>
  <text x="554" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="white">Anleger-</text>
  <text x="554" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="white">wohnung</text>

  <!-- Zeile 1: Zielgruppe -->
  <rect x="20" y="116" width="600" height="44" fill="white" rx="0"/>
  <line x1="20" y1="116" x2="620" y2="116" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="133" font-size="11" font-weight="600" fill="#475569">Zielgruppe</text>
  <text x="208" y="133" font-size="10" fill="#1e3a8a">Mittleres Einkommen,</text>
  <text x="208" y="147" font-size="10" fill="#1e3a8a">ab ca. 50.000 &#8364; Invest.</text>
  <text x="348" y="133" font-size="10" fill="#16a34a">Hohe Steuerlast</text>
  <text x="348" y="147" font-size="10" fill="#16a34a">(Spitzenverdiener)</text>
  <text x="488" y="133" font-size="10" fill="#b45309">Einstieg Kapital-</text>
  <text x="488" y="147" font-size="10" fill="#b45309">anlage, flexibel</text>

  <!-- Zeile 2: Rendite -->
  <rect x="20" y="160" width="600" height="44" fill="#f8fafc" rx="0"/>
  <line x1="20" y1="160" x2="620" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="177" font-size="11" font-weight="600" fill="#475569">Lfd. Rendite (Netto)</text>
  <text x="208" y="177" font-size="10" fill="#1e3a8a">ca. 2&#8211;3,5 % p.a.</text>
  <text x="208" y="191" font-size="10" fill="#64748b">+ Wertsteigerung</text>
  <text x="348" y="177" font-size="10" fill="#16a34a">Steuerersparnis</text>
  <text x="348" y="191" font-size="10" fill="#16a34a">dominiert Rendite</text>
  <text x="488" y="177" font-size="10" fill="#b45309">ca. 2,5&#8211;4 % p.a.</text>
  <text x="488" y="191" font-size="10" fill="#64748b">(marktabh&#228;ngig)</text>

  <!-- Zeile 3: Steuerhebel -->
  <rect x="20" y="204" width="600" height="44" fill="white" rx="0"/>
  <line x1="20" y1="204" x2="620" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="221" font-size="11" font-weight="600" fill="#475569">Steuerhebel</text>
  <text x="208" y="221" font-size="10" fill="#1e3a8a">20 % USt-Abzug</text>
  <text x="208" y="235" font-size="10" fill="#1e3a8a">vom Kaufpreis</text>
  <text x="348" y="221" font-size="10" fill="#16a34a">Verk&#252;rzte AfA,</text>
  <text x="348" y="235" font-size="10" fill="#16a34a">hohe Verlustnutzung</text>
  <text x="488" y="221" font-size="10" fill="#b45309">AfA Geb&#228;ude</text>
  <text x="488" y="235" font-size="10" fill="#b45309">1,5 %/Jahr</text>

  <!-- Zeile 4: Mindest-Haltefrist -->
  <rect x="20" y="248" width="600" height="44" fill="#f8fafc" rx="0"/>
  <line x1="20" y1="248" x2="620" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="265" font-size="11" font-weight="600" fill="#475569">Mindest-Horizont</text>
  <text x="208" y="265" font-size="10" fill="#1e3a8a">25 Jahre (Prognose-</text>
  <text x="208" y="279" font-size="10" fill="#1e3a8a">rechnung Pflicht)</text>
  <text x="348" y="265" font-size="10" fill="#16a34a">Projektlaufzeit</text>
  <text x="348" y="279" font-size="10" fill="#16a34a">oft 10&#8211;15 Jahre</text>
  <text x="488" y="265" font-size="10" fill="#b45309">Flexibel, ab</text>
  <text x="488" y="279" font-size="10" fill="#b45309">5&#8211;10 Jahren</text>

  <!-- Zeile 5: Hauptrisiko -->
  <rect x="20" y="292" width="600" height="50" fill="white" rx="0"/>
  <line x1="20" y1="292" x2="620" y2="292" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="309" font-size="11" font-weight="600" fill="#475569">Hauptrisiko</text>
  <text x="208" y="309" font-size="10" fill="#dc2626">Liebhaberei:</text>
  <text x="208" y="323" font-size="10" fill="#dc2626">USt-R&#252;ckforderung</text>
  <text x="208" y="337" font-size="10" fill="#dc2626">bei Verlust</text>
  <text x="348" y="309" font-size="10" fill="#dc2626">Hohe Einstiegs-</text>
  <text x="348" y="323" font-size="10" fill="#dc2626">kosten, Illiquidit&#228;t,</text>
  <text x="348" y="337" font-size="10" fill="#dc2626">Projektrisiko</text>
  <text x="488" y="309" font-size="10" fill="#dc2626">Leerstand,</text>
  <text x="488" y="323" font-size="10" fill="#dc2626">Mietausfall,</text>
  <text x="488" y="337" font-size="10" fill="#dc2626">Instandhaltung</text>

  <!-- Rahmen ums Grid -->
  <rect x="20" y="72" width="600" height="270" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="4"/>

  <!-- Fu&#223;note -->
  <text x="320" y="394" text-anchor="middle" font-size="10" fill="#94a3b8">Alle Angaben Richtwerte, Stand Juni 2026. Keine Steuer- oder Anlageberatung. Quellen: BMF, WKO, TPA Steuerberatung.</text>
  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#94a3b8">Individuelle Pr&#252;fung durch Steuerberater und Anlageberater erforderlich.</text>
</svg>
