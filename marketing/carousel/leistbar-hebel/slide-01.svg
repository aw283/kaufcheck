<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;}
      .sans{font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;}
    </style>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e1b3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#0e1b3d"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <!-- Subtle accent circle top-right -->
  <circle cx="1060" cy="120" r="320" fill="none" stroke="#16a34a" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="1060" cy="120" r="220" fill="none" stroke="#16a34a" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Lockup oben links -->
  <text x="80" y="104" class="serif" font-size="32" font-weight="400">
    <tspan fill="#ffffff">immo</tspan><tspan fill="#16a34a">ampel</tspan>
  </text>
  <text x="82" y="130" class="sans" font-size="12" letter-spacing="2.5" fill="#8b95a7">IMMOAMPEL.AT</text>

  <!-- Progress dots (5 Slides, Dot 1 aktiv) -->
  <circle cx="912" cy="98" r="5" fill="#ffffff"/>
  <circle cx="934" cy="98" r="5" fill="#34405e"/>
  <circle cx="956" cy="98" r="5" fill="#34405e"/>
  <circle cx="978" cy="98" r="5" fill="#34405e"/>
  <circle cx="1000" cy="98" r="5" fill="#34405e"/>

  <!-- Eyebrow -->
  <line x1="80" y1="442" x2="120" y2="442" stroke="#16a34a" stroke-width="3"/>
  <text x="134" y="448" class="sans" font-size="14" font-weight="700" letter-spacing="3" fill="#16a34a">LEISTBARKEITS-CHECK · ÖSTERREICH</text>

  <!-- Headline -->
  <text x="80" y="578" class="serif" font-size="122" fill="#ffffff">Geht sich</text>
  <text x="80" y="710" class="serif" font-size="122" fill="#dc2626">nicht</text>
  <text x="80" y="842" class="serif" font-size="122" fill="#ffffff">aus?</text>

  <!-- Subline -->
  <text x="80" y="942" class="sans" font-size="30" fill="#aeb6c6">Diese 5 Hebel übersehen</text>
  <text x="80" y="984" class="sans" font-size="30" fill="#aeb6c6">die meisten.</text>

  <!-- Decorative line -->
  <line x1="80" y1="1050" x2="200" y2="1050" stroke="#16a34a" stroke-width="2" opacity="0.6"/>

  <!-- Teaser-Zeilen -->
  <text x="80" y="1108" class="sans" font-size="22" fill="#6b7c9e">Zweiter Kreditnehmer · Verstecktes EK</text>
  <text x="80" y="1144" class="sans" font-size="22" fill="#6b7c9e">Umschuldung · Sicherheit · Förderung</text>

  <!-- Swipe-Hint -->
  <text x="540" y="1296" class="sans" font-size="15" font-weight="600" letter-spacing="3" fill="#6b7488" text-anchor="middle">WEITERSWIPEN →</text>
</svg>
